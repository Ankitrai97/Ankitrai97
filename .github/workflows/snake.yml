name: Generate profile activity

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "generate_profile.py"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Ankitrai97/Ankitrai97'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Generate animated streak table and activity charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate_profile.py

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#ccfbf1,#5eead4,#14b8a6,#0f766e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#161b22,#134e4a,#0f766e,#14b8a6,#5eead4

      - name: Publish generated SVGs to output branch
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/profile-activity"
          mkdir -p "$asset_dir"
          cp dist/*.svg "$asset_dir/"
          for asset in github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg streak-stats.svg streak-stats-dark.svg activity-chart.svg activity-chart-dark.svg; do
            test -s "$asset_dir/$asset"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output > /dev/null; then
            git fetch origin output:refs/remotes/origin/output
            git switch --create output --track origin/output
          else
            git switch --orphan output
          fi

          cp "$asset_dir/"*.svg .
          git add -- '*.svg'
          if git diff --cached --quiet; then
            echo "Profile activity is already up to date."
          else
            git commit -m "chore: refresh profile activity"
            git push origin HEAD:output
          fi
