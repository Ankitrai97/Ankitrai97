<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Ankit Rai — building useful systems with AI</title>
<desc id="desc">A navy banner with violet and mint accents, connected workflow nodes, and the Rapple AI name.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1425"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<circle cx="1090" cy="40" r="190" fill="#8b5cf6" opacity=".07"/>
<circle cx="980" cy="330" r="150" fill="#2dd4bf" opacity=".05"/>
